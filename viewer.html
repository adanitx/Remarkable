<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Remarkable: PDF</title>
  <link rel="stylesheet" href="vendor/pdfjs/pdf_viewer.css">
  <link rel="stylesheet" href="remarkable.css">
  <style>
    html, body { margin: 0; background: #525659; }
    #status {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: #fff; font: 14px system-ui, sans-serif; text-align: center; max-width: 80vw;
    }
    #pages { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 0; }
    .page { position: relative; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.4); }
    .page canvas { display: block; }
  </style>
</head>
<body>
  <div id="status">Cargando PDF…</div>
  <div id="pages"></div>
  <script src="content.js"></script>
  <script type="module" src="viewer.js"></script>
</body>
</html>
